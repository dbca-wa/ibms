# Builds and pushes the multi-architecture (amd64/arm64) image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
name: Build multi-architecture image

on:
  schedule:
    # 0511 AWST, Mon-Fri
    - cron: '11 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.scan.outputs.image_ref }}
    permissions:
      contents: read
      packages: write # push image to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,event=branch,branch=dev
            type=semver,pattern={{version}}

      - name: Set scan image ref
        id: scan
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag=$(printf '%s\n' "$TAGS" | awk 'NF{print; exit}')
          echo "image_ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push with buildx bake
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TAGS_JSON=$(printf '%s\n' "$TAGS" | awk 'NF' | jq -R . | jq -s -c .)
          printf 'target "app" {\n  tags = %s\n}\n' "$TAGS_JSON" > /tmp/bake-tags.hcl
          docker buildx bake --push -f docker-bake.hcl -f /tmp/bake-tags.hcl

  scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: 'image'
          scanners: 'vuln'
          image-ref: ${{ needs.build.outputs.image_ref }}
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: 'trivy-results.sarif'
